name: Build resume PDF

# CI owns the built PDF: pushes to main rebuild Caleb-Brown-Resume.pdf and
# commit it back, so it can never drift from the .tex.
# The path filter deliberately omits the PDF, so the bot's commit doesn't
# retrigger this workflow. On a PR the job only checks that it still compiles
# to one page -- the commit step is skipped, since the PDF lands on main.
on:
  push:
    branches: [main]
    paths:
      - 'resume/Caleb-Brown-Resume.tex'
      - '.github/workflows/resume.yml'
  pull_request:
    paths:
      - 'resume/Caleb-Brown-Resume.tex'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-extra \
            poppler-utils

      - name: Build PDF
        # SOURCE_DATE_EPOCH pins the PDF's creation date to the commit date, so
        # identical sources produce an identical file and re-runs don't generate
        # empty diffs.
        working-directory: resume
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export FORCE_SOURCE_DATE=1
          pdflatex -interaction=nonstopmode -halt-on-error Caleb-Brown-Resume.tex
          pages="$(pdfinfo Caleb-Brown-Resume.pdf | awk '/^Pages:/ {print $2}')"
          [ "$pages" = "1" ] || { echo "::error::Resume is $pages pages, must be 1"; exit 1; }

      - name: Commit the rebuilt PDF
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- resume/Caleb-Brown-Resume.pdf; then
            echo "PDF unchanged; nothing to commit."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add resume/Caleb-Brown-Resume.pdf
          git commit -m 'Rebuild resume PDF'
          git push
